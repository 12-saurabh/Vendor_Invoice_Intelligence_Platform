apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  namespace: vendor-invoice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-webhook
  template:
    metadata:
      labels:
        app: alert-webhook
    spec:
      containers:
        - name: webhook
          image: python:3.11-slim
          command:
            - python
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              import json

              class Handler(BaseHTTPRequestHandler):
                  def do_POST(self):
                      length = int(self.headers.get("Content-Length", 0))
                      body = self.rfile.read(length)

                      print("\n========== ALERT RECEIVED ==========")
                      try:
                          data = json.loads(body)
                          print(json.dumps(data, indent=2))
                      except Exception:
                          print(body.decode())

                      print("====================================\n")

                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"OK")

                  def log_message(self, format, *args):
                      return

              server = HTTPServer(("0.0.0.0", 8080), Handler)
              print("Alert webhook listening on port 8080")
              server.serve_forever()

          ports:
            - containerPort: 8080
              name: http

---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
  namespace: vendor-invoice
spec:
  selector:
    app: alert-webhook
  ports:
    - name: http
      port: 8080
      targetPort: 8080