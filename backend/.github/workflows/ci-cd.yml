name: Vendor Invoice Platform CI/CD

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

jobs:

  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest -v


  docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t vendor-invoice-backend:${{ github.sha }} .


  deploy:
    name: Kubernetes Deployment
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deployment status
        run: |
          echo "Tests passed"
          echo "Docker image built successfully"
          echo "Kubernetes deployment stage ready"