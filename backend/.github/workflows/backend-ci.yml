name: Backend CI

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendor_invoice_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

    env:

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vendor_invoice_db

      SECRET_KEY: githubsecret

      MAIL_USERNAME: demo@example.com
      MAIL_PASSWORD: password
      MAIL_FROM: demo@example.com

    steps:

      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m compileall app

      - name: Build Docker Image
        run: |
          docker build -t vendor-backend .