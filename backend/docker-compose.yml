version: "3.9"

services:
  
    prometheus:
      image: prom/prometheus
      container_name: vendor-prometheus

      ports:
        - "9090:9090"

      volumes:
        - ./prometheus.yml:/etc/prometheus/prometheus.yml

      depends_on:
        - backend

    grafana:
      image: grafana/grafana
      container_name: vendor-grafana

      ports:
        - "3000:3000"

      depends_on:
        - prometheus

    postgres:
      image: postgres:16
      container_name: vendor-postgres
      restart: always

      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: saurabh1209
        POSTGRES_DB: vendor_invoice_db

      ports:
        - "5432:5432"

      volumes:
        - postgres_data:/var/lib/postgresql/data

    redis:
      image: redis:7-alpine
      container_name: vendor-redis

      restart: always

      ports:
        - "6379:6379"

    backend:
      build: .
      container_name: vendor-backend

      depends_on:
        - postgres
        - redis

      ports:
        - "8000:8000"

      env_file:
        - .env

      environment:
        DATABASE_URL: postgresql://postgres:saurabh1209@postgres:5432/vendor_invoice_db

volumes:
  postgres_data: